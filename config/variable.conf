# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = pkill rofi || bash ~/.config/rofi/launcher.sh # Rofi
$waybar = pkill waybar || waybar

$browser = zen-beta
$note = gnome-text-editor
$code = code
$hyprlock = hyprlock --config ~/.config/hypr/hyprlock/hyprlock.conf

