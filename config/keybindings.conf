###################
### KEYBINDINGS ###
###################


# See https://wiki.hypr.land/Configuring/Keywords/
# Set hot key
$mainMod = SUPER # Sets "Windows" key as main modifier

# Common use cases:
#   - Launch apps (e.g terminal, browser)
#   - Manage windows (move, resize, close)
#   - Control system function (volume, brightness)

#############################
###    VARIABLE SOURCE    ###
#############################
# Define additional configuration source to load specific variables and path
source = ~/.config/hypr/config/variable.conf            # This is important for keybind to work effectively as other key depends on it like terminal and also file manager

#############################
###         APPS          ###
#############################

# Clipboard History
bind = $mainMod ALT, V, exec, ~/.config/waybar/scripts/clipManager.sh # Clipboard Manager

# Wallpaper Switcher
bind = $mainMod, W, exec, ~/.config/waybar/scripts/wallpaperSelect.sh # Select wallpaper to apply

# Theme Switcher
bind = $mainMod, T, exec, ~/.config/waybar/scripts/themeSelector.sh # Select theme to apply

# Lauch default applications (terminal, note, code editor, file explorer)
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, M, exec, wlogout -b 5
bind = SUPER, L, exec, $hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, $note
bind = $mainMod, C, exec, $code
bind = $mainMod, R, exec, $waybar                  # start or stop waybar display

#############################
###       FUNCTION        ###
#############################

# Bind various function such as killing active window, toggling fullscreen and toggling window float behaviour
bind = $mainMod, Q, killactive,                                              # Kill an active window
bind = $mainMod, F, fullscreen                                               # Toggle fullscreen for active window
bind = $mainMod, V, togglefloating,                                          # Toggle floating mode for active window
bind = $mainMod, P, pseudo,                                                  # Enable pseudo-tiling (dwindle layout)
bind = $mainMod, J, layoutmsg, togglesplit                                   # Toggle split (dwindle layour)


#############################
###      SCREENSHOT       ###
#############################

# Screenshot bindings
bind = $mainMod, PRINT, exec, hyprshot -m output
bind = $mainMod+ALT, PRINT, exec, hyprshot -m window
bind = $mainMod+CTRL, PRINT, exec, hyprshot -m region


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# SwayOSD
# Volume
bind = , XF86AudioRaiseVolume, exec, ~/.config/swaync/scripts/audio.sh --inc
bind = , XF86AudioLowerVolume, exec, ~/.config/swaync/scripts/audio.sh --dec
bind = , XF86AudioMute, exec, ~/.config/swaync/scripts/audio.sh --mute

# Monitor Brightness
bind = , XF86MonBrightnessUp, exec, ~/.config/swaync/scripts/brightness.sh --inc
bind = , XF86MonBrightnessDown, exec, ~/.config/swaync/scripts/brightness.sh --dec


