#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# Environments
env = XDG_DATA_DIRS,$HOME/.local/share:$HOME/.nix-profile/share:/nix/var/nix/profiles/default/share:/usr/local/share:/usr/share
env = PATH,$HOME/.local/bin:$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin


# Force the cursor theme and size
env = XCURSOR_THEME,Moga-Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Moga-Cursor
env = HYPRCURSOR_SIZE,24
env = QT_QUICK_CONTROLS_STYLE,org.hyprland.style

# Toolkit backend
env = GDK_BACKEND,wayland,x11,*     # GTK: Use Wayland if available; if not, try X11 and then any other GDK backend.
env = QT_QPA_PLATFORM,wayland;xcb   # Qt: Use Wayland if available, fall back to X11 if not.
env = SDL_VIDEODRIVER,wayland       # Run SDL2 applications on Wayland. Remove or set to x11 if games that provide older versions of SDL cause compatibility issues
env = CLUTTER_BACKEND,wayland       # Clutter package already has Wayland enabled, this variable will force Clutter applications to try and use the Wayland backend

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt variable
env = QT_AUTO_SCREEN_SCALE_FACTOR,1                 # enables automatic scaling, based on the monitor’s pixel density
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1         # Disables window decorations on Qt applications
env = QT_QPA_PLATFORMTHEME,qt5ct                    # Tells Qt based applications to pick your theme from qt5ct, use with Kvantum.



