$CITY = Ilorin
$COUNTRY = Nigeria
$WALL = ~/.config/hypr/images/avatar/1.png
source = colors/colors.conf             # Colors and image generated with matugen

# Background
background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 1
    contrast = 0.8
    brightness = 0.73
    vibrancy = 0.16
    vibrancy_darkness = 0.0
}


















# General
general {
    ignore_empty_input = false    # CHANGED: Crucial so pressing Enter triggers PAM/Howdy
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    pam:enabled = true            # ADDED: Forces PAM integration explicitly
    pam:module = hyprlock         # ADDED: Targets /etc/pam.d/hyprlock
}

# Input field
input-field {
    size = 170, 45
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = $on_primary
    inner_color = $primary
    font_color = $on_primary
    font_family = $font_family
    outline_thickness = 5
    fade_on_empty = true
    fade_timeout = 10 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <span></span> # Text rendered in the input box when it's empty. **Leave it empty since fade on empty is true
    hide_input = false
    position = 0, -425
    rounding = 10 # -1 means complete rounding (circle/oval)
    check_color = $primary
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}

# Time
label {
    #clock
    text = cmd[update:1000] echo "<b><big> <span>$(date +"%I:%M")</span> </big></b>"
    color = $primary
    font_size = 85
    font_family = $font_family_clock
    position = 0, 310
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Day-Month-Date
label {
    #clock
    text = cmd[update:60000] echo "<b> $(date +"%A, %B %d")</b>"
    color = $primary
    font_size = 30
    font_family = $font_family_clock
    position = 0, 400
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Profile picture
image {
    path = $WALL
    size = 170 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 6
    border_color = $primary $on_primary 90deg #$primary $on_primary
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, -300
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}

# Users
label {
    text = $USER
    color = $primary
    font_size = 16
    font_family = $font_family_clock
    position = 0, -190
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

#Current song
label{
    text = cmd[update:0] ~/.config/hypr/hyprlock/scripts/spotify.sh
    color = $primary
    font_size = 12
    font_family = $font_family
    position = 20, 120
    halign = left
    valign = center
}

# Battery Status
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/hyprlock/scripts/battery.sh
    color = $primary
    font_size = 12
    font_family = $font_family
    position = 20, 90
    halign = left
    valign = center
}

# WiFi Status
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/hyprlock/scripts/wifi.sh
    color = $primary
    font_size = 12
    font_family = $font_family
    position = 20, 60
    halign = left
    valign = center
}

#Weather and location
label{
    text = cmd[update:0] ~/.config/hypr/hyprlock/scripts/weather.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $primary
    font_size = 12
    font_family = $font_family
    position = 20, 30
    halign = left
    valign = center
}




