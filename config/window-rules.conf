
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

decoration {
    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = yad

    match:class = yad
    # -- 20 pixels from the left, 20 pixels from the top
    move = 55 60
    float = yes

    # Change the border thickness (value in pixels)
    border_size = 2

    opacity = 0.9 0.7
}

windowrule {
    name = pavucontrol

    match:class = pavucontrol

    float = yes
}

windowrule {
    name = eog # Eye of gnome

    match:class = eog # Eye of gnome

    float = yes
}

windowrule {
    name = rofi

    match:class = rofi

    float = yes

    opacity = 0.9 0.6
}

# Force File Roller dialogs to center and prevent them from expanding off-screen
windowrule {
    name = File Roller Center Fix

    match:class = file-roller

    float = yes
    center = yes
    max_size = 80% 80%
    border_size = 2
}
