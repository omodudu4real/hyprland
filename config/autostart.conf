#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = /usr/local/bin/swww-daemon
# exec-once = ~/.config/hypr/scripts/load-last-wallpaper.sh         # Only use if you want waypaper to be restoring the image
exec-once = /home/omodudu/.config/waybar/scripts/wallpaperSelect.sh --restore # only use if you want wallpaper script to be restoring the image

# 3. Apply the cursor theme immediately on startup
exec-once = hyprctl setcursor Moga-Cursor 24

# System Applications:
# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet --indicator &


exec-once = xwaylandvideobridge &                           # xwaylandvideobridge is like a compatibility tool for running X11/Xorg windows on wayland
exec-once = wl paste -p --watch wl copy -pc &               # Disable middle click paste functionality to avoid accidental pasting
exec-once = wl-clip-persist --clipboard regular &           # Persistent clipboard

# Start the Polkit agent
# exec = /usr/libexec/hyprpolkitagent  ## The system will start it automatically

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#################
### DESKTOP  ###
#################
# This app gives desktop experience such as task bar, notification daemon etc
exec-once = swaync &                                            # Swaync is a notification daemon that displays notifications on wayland desktop
# exec-once = /home/omodudu/.nix-profile/bin/swayosd-server &     # swayosd is a notification deamon that shows the notification visuals
exec-once = hypridle &                                          # Lock the screen when inactive
exec-once = waybar &

# Keybord Brightness Watcher Script
exec-once = ~/.config/swaync/scripts/kbd_watcher.sh
exec-once = ~/.config/swaync/scripts/mic_watcher.sh











